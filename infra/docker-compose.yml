services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meetpilot
      POSTGRES_PASSWORD: meetpilot
      POSTGRES_DB: meetpilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetpilot"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
